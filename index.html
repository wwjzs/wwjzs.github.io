<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal homepage and contact details for Weijie Wang">
  <title>Weijie Wang · Personal Homepage</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f7fb; color: #172033; }
    main { width: min(100% - 32px, 720px); margin: clamp(48px, 12vh, 120px) auto; }
    .card { background: white; border: 1px solid #e7eaf0; border-radius: 22px; padding: clamp(28px, 7vw, 64px); box-shadow: 0 20px 60px rgba(27, 43, 77, .06); }
    .eyebrow { margin: 0 0 18px; color: #4666a6; font-size: 13px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(40px, 8vw, 68px); letter-spacing: -.055em; line-height: 1.05; }
    .intro { margin: 23px 0 36px; color: #526078; font-size: clamp(17px, 2.4vw, 20px); line-height: 1.6; }
    .contact { border-top: 1px solid #e7eaf0; padding-top: 27px; }
    .label { display: block; margin-bottom: 9px; color: #64728b; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
    a { color: #245bb6; font-size: 18px; overflow-wrap: anywhere; text-underline-offset: 4px; }
    a:hover { color: #143e80; }
    footer { margin: 20px 4px; color: #758198; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <p class="eyebrow">Personal Homepage</p>
      <h1>Weijie Wang</h1>
      <p class="intro">Welcome to my personal homepage. You can reach me using the email address below.</p>
      <div class="contact">
        <span class="label">Email</span>
        <a href="mailto:251050013@hdu.edu.cn">251050013@hdu.edu.cn</a>
      </div>
    </div>
    <footer>Personal homepage · Contact information</footer>
  </main>
</body>
</html>
